<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Jev creative demo - emoji pile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f2f2f4; --text:#1d1d1f; --muted:#8a8a90; --line:#e2e2e6; --accent:#0a84ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
               font: 15px/1.4 "Segoe UI", system-ui, sans-serif; }
  .top { position:fixed; top:14px; left:18px; right:18px; display:flex; justify-content:space-between;
         font-size:12px; color:var(--muted); z-index:5; }
  .top a { color:var(--muted); text-decoration:none; } .top a:hover { color:var(--accent); }
  .pill { background:#fff; border:1px solid var(--line); border-radius:999px; padding:3px 10px; }
  .pill i { display:inline-block; width:7px; height:7px; border-radius:50%; background:#34c759; margin-right:6px; }
  .search { position:fixed; left:50%; top:16vh; transform:translateX(-50%); width:min(560px, 86vw); z-index:5; }
  form { display:flex; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px;
         box-shadow: 0 6px 22px rgba(0,0,0,.06); padding:4px 6px 4px 18px; }
  input { flex:1; border:0; outline:0; font: 16px "Segoe UI", sans-serif; padding:12px 0; background:transparent; color:var(--text); }
  form button { border:0; background:transparent; font-size:18px; color:var(--muted); cursor:pointer; padding:8px 12px; border-radius:8px; }
  form button:hover { background:#f2f2f4; color:var(--text); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .chips button { border:1px solid var(--line); background:#fff; color:#555; border-radius:999px; padding:4px 11px;
                  font: 12px "Segoe UI", sans-serif; cursor:pointer; }
  .chips button:hover { border-color:#c8c8ce; color:var(--text); }
  .progress { text-align:center; margin-top:10px; font-size:12px; color:var(--muted); min-height:18px; }
  .emoji { position:fixed; left:0; top:0; font-size:30px; line-height:1; user-select:none; cursor:default;
           transition: transform .9s cubic-bezier(.2,.85,.25,1), filter .3s; will-change: transform;
           font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  .emoji.thinking { filter: drop-shadow(0 0 6px rgba(10,132,255,.9)); }
  .emoji.picked { z-index:4; cursor:help; }
  .tip { position:fixed; z-index:10; background:#1d1d1f; color:#fff; font-size:12px; padding:4px 8px; border-radius:6px;
         pointer-events:none; opacity:0; transition: opacity .15s; white-space:nowrap; }
  .foot { position:fixed; bottom:8px; left:0; right:0; text-align:center; font-size:11px; color:#a8a8ae; z-index:5; }
</style>
</head>
<body>
<div class="top"><a href="/">← Jev demos</a><span class="pill"><i></i><span id="backend">connecting…</span></span></div>
<div class="search">
  <form id="form" autocomplete="off">
    <input id="prompt" placeholder="Describe something… e.g. things you can wear in winter" autofocus>
    <button type="submit" title="Ask">→</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="progress" id="progress"></div>
</div>
<div class="tip" id="tip"></div>
<div class="foot">Every emoji is one <b>Noul</b> decision: “Is this related to: &lt;your request&gt;?” · emoji that stand out for your request fly up as the decisions stream in</div>

<script>
const $ = id => document.getElementById(id);
const CHUNK = 8;
let catalog = [], selection = { k: 2.5, min_p: 0.08, max: 12, warmup: 24 }, generation = 0;
const picked = new Map();     // id -> p (currently flown up)
const seen = new Map();       // id -> p (all decisions for the current prompt)
let threshold = null;

// P(related) levels differ per prompt, so pick the outliers of THIS prompt's distribution.
function select() {
  const ps = [...seen.values()];
  picked.clear();
  if (ps.length < selection.warmup) { threshold = null; return; }
  const mean = ps.reduce((a, b) => a + b, 0) / ps.length;
  const sd = Math.sqrt(ps.reduce((a, b) => a + (b - mean) ** 2, 0) / ps.length);
  threshold = Math.max(selection.min_p, mean + selection.k * sd);
  [...seen.entries()].filter(([, p]) => p >= threshold).sort((a, b) => b[1] - a[1])
    .slice(0, selection.max).forEach(([id, p]) => picked.set(id, p));
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function layoutPile() {
  const W = window.innerWidth, H = window.innerHeight, size = 32;
  const buckets = Math.max(10, Math.floor(W / (size * 0.85)));
  const heights = new Array(buckets).fill(0);
  const rng = mulberry32(42);
  for (const it of catalog) {
    // 40% uniform + 60% triangular: a wide, low heap like the video (no stray tails)
    const u = rng() < .4 ? rng() : (rng() + rng()) / 2;
    let b = Math.floor((0.04 + 0.92 * u) * buckets);
    b = Math.max(0, Math.min(buckets - 1, b));
    for (let k = 0; k < 4; k++) {                 // settle like sand: roll to a lower neighbour
      if (b > 0 && heights[b - 1] < heights[b] - size * .5) b--;
      else if (b < buckets - 1 && heights[b + 1] < heights[b] - size * .5) b++;
    }
    it.pile = { x: b * (W / buckets) + rng() * 8 - 4, y: H - 30 - heights[b] - size, r: rng() * 80 - 40 };
    heights[b] += size * 0.5;
  }
}

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function layoutPicked() {
  const ids = [...picked.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => id);
  const box = document.querySelector(".search").getBoundingClientRect();
  const perRow = Math.max(4, Math.min(12, Math.floor(window.innerWidth * .8 / 58)));
  const top = box.bottom + 26;
  ids.forEach((id, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, ids.length - row * perRow);
    const x = window.innerWidth / 2 + (col - (inRow - 1) / 2) * 58 - 16;
    catalog[id].target = { x, y: top + row * 60, r: 0, s: 1.45 };
  });
}

function place(it) {
  const p = picked.has(it.id) ? it.target : { ...it.pile, s: 1 };
  it.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.r}deg) scale(${p.s})`;
}

function render() { layoutPicked(); catalog.forEach(place); }

function showTip(e, it) {
  const tip = $("tip");
  const p = seen.get(it.id);
  tip.textContent = p === undefined ? it.name : `${it.name} · P(related) ${p.toFixed(2)}`;
  tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY + 12}px`; tip.style.opacity = 1;
}

async function ask(prompt) {
  prompt = prompt.trim();
  if (!prompt) return;
  const gen = ++generation;
  picked.clear(); seen.clear(); threshold = null; render();
  $("progress").textContent = "Deciding…";
  const order = shuffle(catalog.map(it => it.id));
  const t0 = performance.now();
  let done = 0, cached = 0, ms = 0;
  for (let i = 0; i < order.length; i += CHUNK) {
    const ids = order.slice(i, i + CHUNK);
    ids.forEach(id => catalog[id].el.classList.add("thinking"));
    let res;
    try {
      const r = await fetch("/api/creative/decide", { method: "POST", headers: { "Content-Type": "application/json" },
                                                       body: JSON.stringify({ prompt, ids }) });
      res = await r.json();
      if (res.error) throw new Error(res.error);
    } catch (err) {
      $("progress").textContent = `Error: ${err.message}`;
      ids.forEach(id => catalog[id].el.classList.remove("thinking"));
      return;
    }
    ids.forEach(id => catalog[id].el.classList.remove("thinking"));
    if (gen !== generation) return;                 // a newer prompt took over
    for (const { id, p } of res.results) seen.set(id, p);
    select();
    done += ids.length; cached += res.cached; ms += res.ms;
    render();
    const live = done - cached;
    $("progress").textContent = `${done} / ${catalog.length} decisions · ${picked.size} picked` +
      (live ? ` · ${Math.round(ms / Math.max(live, 1))} ms per decision` : " · cached");
  }
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  $("progress").textContent = `${catalog.length} decisions in ${secs} s · ${picked.size} picked` +
    (threshold !== null ? ` · P(related) ≥ ${threshold.toFixed(2)}` : "") +
    (cached === catalog.length ? " · cached" : "");
}

async function init() {
  const [config, items] = await Promise.all([fetch("/api/config").then(r => r.json()),
                                             fetch("/api/creative/catalog").then(r => r.json())]);
  selection = config.selection;
  $("backend").textContent = config.backend.replace(/\(.*\)/, "").trim();
  $("backend").title = config.backend;
  catalog = items.map(it => {
    const el = document.createElement("span");
    el.className = "emoji"; el.textContent = it.emoji;
    el.addEventListener("mousemove", e => showTip(e, { ...it }));
    el.addEventListener("mouseleave", () => $("tip").style.opacity = 0);
    document.body.appendChild(el);
    return { ...it, el };
  });
  layoutPile(); render();
  for (const s of config.suggestions) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = s;
    b.onclick = () => { $("prompt").value = s; ask(s); };
    $("chips").appendChild(b);
  }
}

$("form").onsubmit = e => { e.preventDefault(); ask($("prompt").value); };
window.addEventListener("resize", () => { layoutPile(); render(); });
init().catch(err => $("progress").textContent = `Could not reach the demo server: ${err.message}`);
</script>
</body>
</html>
